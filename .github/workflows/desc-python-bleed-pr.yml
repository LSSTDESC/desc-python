name: desc-python-bleed-pr

on:
  pull_request:
    branches:
    - bleed
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  pull-requests: read
  issues: write

env:
  TEST_TAG: lsstdesc/desc-python:pr

jobs:
  build:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/run-tests') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))

    steps:
      - name: Get PR info (comment trigger only)
        id: pr_info
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);

      - name: Acknowledge comment (optional)
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Triggered a test run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      


      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'issue_comment' && steps.pr_info.outputs.sha || '' }}
          fetch-depth: 1

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: "latest"
          python-version: "3.12"
          channels: conda-forge
          activate-environment: lock-env


      - name: set up env
        run: |
          echo "DATE_TAG=$(date "+%F")" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            RAW_BRANCH="${{ steps.pr_info.outputs.ref }}"
          else
            RAW_BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          # sanitize: replace any character that isn't alnum, dot, or dash with a dash
          SAFE_BRANCH=$(echo "$RAW_BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "BRANCH_NAME=$SAFE_BRANCH" >> $GITHUB_ENV

      - name: Create lock file
        id: create_lock
        shell: bash -el {0}
        run: |
          cd $GITHUB_WORKSPACE
          conda install -c conda-forge -y -n lock-env conda-lock
          conda-lock lock -c conda-forge/label/mpi-external -c conda-forge -f ./conda/lock/environment.yml -f ./conda/lock/pyproject.toml -p linux-64 --lockfile ./conda/lock/auto/desc-py-bleed-lock-linux-64-${{env.BRANCH_NAME}}-${{env.DATE_TAG}}.yml

      - name: Report lock file failure
        if: failure() && steps.create_lock.outcome == 'failure'
        run: |
          echo "### ❌ Conda-lock file creation failed" >> $GITHUB_STEP_SUMMARY
          echo "See the 'Create lock file' step logs above for details." >> $GITHUB_STEP_SUMMARY
          exit 1
          

     
